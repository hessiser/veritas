
name: Enhancements
description: Suggest an idea for this project
title: "[ENHANCEMENT] "
labels:
  - enhancement
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Enhancement requests are intended for improvements to Veritas itself,
        including the server, UI, configuration, and existing functionality.

        Please do not submit requests for new game features.
        The only exception is expanding or improving functionality that already exists.

  - type: textarea
    id: enhancement_request
    attributes:
      label: What enhancements do you want?
      description: Describe the improvement you would like to see.
      placeholder: |
        Explain what you want to improve and why it would be useful.
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Describe the solution you'd like
      description: Explain how you would like the enhancement to work and how reasonable or practical the proposed solution is.
      placeholder: |
        Describe your proposed solution.

        How should it work?
        What problem would it solve?
        Are there any limitations or alternative approaches?
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add any other information, examples, mockups, or screenshots that may help explain the enhancement.
      placeholder: |
        Provide any additional context or attach relevant screenshots.
    validations:
      required: false
